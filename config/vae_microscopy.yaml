project_name: "microscopy_vae"
experiment_name: "microscopy_vae"
data: "metadata/cell_lines_drug_compounds.csv"
data_root: "/path/to/your/dataset"   # prepended to each row's `relpath` in `data` above

model:
  name: "microscopy_vae"
  in_channels: 3
  latent_channels: 4        # This creates the 4x32x32 latent grid
  base_channels: 64         # Starting filters for the ResNet blocks

preprocessing:
  img_size: 256

training:
  epochs: 200
  batch_size: 32            # Lower batch size because ResNet/SSIM uses more VRAM
  learning_rate: 1e-4        # Lower LR is usually better for SSIM/L1 stability
  warmup_ratio: 0.05
  beta: 1.0e-07              # Tiny KL weight to keep the latent space clean
  alpha_ssim: 0.6             # Balance between pixel-perfect (L1) and structural (SSIM)
  lam_rot: 0.0                # Rotation-invariance penalty (0 = disabled)
  ema_decay: 0.999
  log_interval: 5
  weight_decay: 0.00001
  filtered_only: false
